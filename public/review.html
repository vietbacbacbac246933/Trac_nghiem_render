<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập - Trắc Nghiệm</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/katex/katex.min.css">
<script src="/katex/katex.min.js"></script>
<script src="/katex/contrib/auto-render.min.js"></script>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: #f4f6fb;
        color: #24303f;
    }
    a { color: #4f61d6; }
    .review-header {
        background: linear-gradient(135deg, #4c56c4 0%, #5e3a86 100%);
        color: #fff;
        padding: 18px 20px;
    }
    .review-header-inner {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
    }
    .review-header img { width: 42px; height: 42px; }
    .review-header h1 { margin: 0; font-size: 1.25em; }
    .review-header p { margin: 3px 0 0; font-size: 0.85em; opacity: 0.85; }
    .header-spacer { flex: 1; }
    .header-link {
        color: #fff;
        text-decoration: none;
        background: rgba(255,255,255,0.18);
        padding: 9px 14px;
        border-radius: 8px;
        font-size: 0.9em;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 16px 50px; }
    .panel {
        background: #fff;
        border: 1px solid #e3e7f1;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 18px;
    }
    .panel h2 { margin: 0 0 6px; font-size: 1.2em; }
    .muted { color: #667085; font-size: 0.92em; }
    .student-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .student-row label { font-weight: 600; }
    select, input[type="text"], input[type="search"] {
        padding: 10px 12px;
        border: 1px solid #cbd2e1;
        border-radius: 8px;
        /* 16px: iOS Safari tự phóng to trang nếu ô nhập nhỏ hơn 16px. */
        font-size: 16px;
        background: #fff;
        color: #24303f;
    }
    .student-row select { min-width: 230px; }
    .list-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 14px;
    }
    .list-card {
        display: block;
        background: #fff;
        border: 1px solid #e3e7f1;
        border-radius: 12px;
        padding: 16px;
        text-decoration: none;
        color: inherit;
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    .list-card:hover { border-color: #667eea; box-shadow: 0 6px 18px rgba(102,126,234,0.15); }
    .list-card h3 { margin: 0 0 6px; font-size: 1.05em; color: #3c4cc0; }
    .badge {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 0.76em;
        font-weight: 600;
        background: #eef1ff;
        color: #4353b8;
    }
    .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin: 16px 0;
    }
    .toolbar input[type="text"] { flex: 1; min-width: 200px; }
    .exam-list { display: grid; gap: 12px; }
    .exam-card {
        background: #fff;
        border: 1px solid #e3e7f1;
        border-radius: 12px;
        padding: 16px;
    }
    .exam-card-head {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
    }
    .exam-card h3 { margin: 0 0 5px; font-size: 1.05em; }
    .exam-meta { color: #667085; font-size: 0.88em; line-height: 1.5; }
    .exam-status { font-weight: 600; color: #3f51b5; }
    .exam-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
    }
    .btn {
        display: inline-block;
        border: none;
        border-radius: 8px;
        padding: 9px 16px;
        font-size: 0.92em;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
    }
    .btn-primary { background: #5c6bc0; color: #fff; }
    .btn-primary:hover { background: #4a5ab0; }
    .btn-secondary { background: #eef1ff; color: #3f51b5; }
    .btn-secondary:hover { background: #e0e5ff; }
    .btn:disabled { background: #eceff4; color: #98a2b3; cursor: not-allowed; }
    .empty {
        text-align: center;
        color: #667085;
        padding: 36px 16px;
    }
    .error-box {
        background: #fdecea;
        border: 1px solid #f5c2c0;
        color: #b3261e;
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 16px;
    }
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        z-index: 1000;
        padding: 16px;
    }
    .modal.show { display: flex; align-items: flex-start; justify-content: center; }
    .modal-box {
        background: #fff;
        border-radius: 14px;
        width: 100%;
        max-width: 940px;
        max-height: calc(100vh - 32px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.3);
    }
    .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        border-bottom: 1px solid #edf0f7;
        flex: 0 0 auto;
    }
    .modal-head h3 { margin: 0; font-size: 1.08em; flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .modal-close {
        background: #f1f3f9;
        border: none;
        border-radius: 8px;
        width: 40px;
        height: 40px;
        font-size: 1.2em;
        cursor: pointer;
        flex: 0 0 auto;
    }
    .modal-body {
        padding: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        flex: 1 1 auto;
    }
    body.modal-open { overflow: hidden; }

    /* ---- Lịch sử làm bài ---- */
    .hist-wrap { padding: 16px 18px 28px; }
    .hist-attempts {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 2px 0 8px;
        margin-bottom: 6px;
        scrollbar-width: thin;
    }
    .hist-attempt {
        flex: 0 0 auto;
        min-width: 132px;
        border: 1px solid #dde2f0;
        border-radius: 10px;
        background: #f8f9fe;
        padding: 8px 10px;
        text-align: left;
        cursor: pointer;
        font: inherit;
        color: #24303f;
    }
    .hist-attempt.active {
        border-color: #5c6bc0;
        background: #eef1ff;
        box-shadow: inset 0 0 0 1px #5c6bc0;
    }
    .hist-attempt-title { display: block; font-size: 0.82em; font-weight: 700; color: #4353b8; }
    .hist-attempt-score { display: block; font-size: 0.95em; font-weight: 700; margin-top: 1px; }
    .hist-attempt-date { display: block; font-size: 0.74em; color: #667085; margin-top: 1px; }

    .hist-overview {
        border: 1px solid #e3e7f1;
        border-radius: 12px;
        padding: 14px;
        background: #fbfcff;
    }
    .hist-topline { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .hist-score { font-size: 1.8em; font-weight: 800; color: #3f51b5; line-height: 1.1; }
    .hist-score small { font-size: 0.5em; color: #667085; font-weight: 600; }
    .hist-facts { display: flex; flex-direction: column; gap: 2px; font-size: 0.85em; color: #667085; min-width: 150px; }
    .hist-counts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .hist-count {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 0.8em;
        font-weight: 600;
    }
    .c-correct { background: #e7f6ec; color: #1b7f3b; }
    .c-wrong { background: #fdecea; color: #b3261e; }
    .c-unanswered { background: #eef1ff; color: #4353b8; }
    .c-partial { background: #fff4e5; color: #a15c00; }
    .hist-more { margin-top: 8px; font-size: 0.85em; color: #667085; }
    .hist-more summary { cursor: pointer; color: #4f61d6; font-weight: 600; }
    .hist-more p { margin: 6px 0 0; line-height: 1.55; }

    .hist-toolbar {
        position: sticky;
        top: 0;
        z-index: 3;
        background: #fff;
        padding: 10px 0 8px;
        margin-top: 6px;
        border-bottom: 1px solid #edf0f7;
    }
    .hist-search { display: block; width: 100%; margin-bottom: 8px; }
    .hist-search input { width: 100%; }
    .hist-filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
    .hist-filter {
        flex: 0 0 auto;
        min-height: 36px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid #dde2f0;
        background: #f1f3f9;
        color: #4353b8;
        font: inherit;
        font-size: 0.86em;
        font-weight: 600;
        cursor: pointer;
    }
    .hist-filter.active { background: #5c6bc0; color: #fff; border-color: #5c6bc0; }
    .hist-filter .n { margin-left: 3px; opacity: 0.85; font-weight: 700; }

    .hist-nav { margin-top: 10px; border: 1px solid #e3e7f1; border-radius: 10px; padding: 8px 10px; background: #fff; }
    .hist-nav summary { cursor: pointer; font-weight: 600; font-size: 0.9em; color: #3f51b5; }
    .qmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; margin-top: 8px; }
    .qmap-btn {
        min-height: 34px;
        padding: 2px;
        border-radius: 7px;
        border: 1px solid #dde2f0;
        background: #f7f8fd;
        color: #4353b8;
        font: inherit;
        font-size: 0.8em;
        font-weight: 600;
        cursor: pointer;
    }
    .qmap-btn.st-correct { background: #e7f6ec; color: #1b7f3b; border-color: #b9e3c8; }
    .qmap-btn.st-wrong { background: #fdecea; color: #b3261e; border-color: #f2c3bf; }
    .qmap-btn.st-unanswered { background: #eef1ff; color: #4353b8; border-color: #d4d9f5; }
    .qmap-btn.st-partial { background: #fff4e5; color: #a15c00; border-color: #f4d8ae; }
    .qmap-btn:focus-visible, .hist-filter:focus-visible, .hist-q-head:focus-visible { outline: 2px solid #5c6bc0; outline-offset: 2px; }
    .qmap-legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 7px; font-size: 0.76em; color: #667085; }
    .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 3px; vertical-align: middle; }

    .hist-list { margin-top: 10px; }
    .hist-q {
        border: 1px solid #e3e7f1;
        border-left: 4px solid #dde2f0;
        border-radius: 10px;
        margin-bottom: 8px;
        background: #fff;
        overflow: hidden;
    }
    .hist-q.open { border-color: #c7cff0; box-shadow: 0 4px 14px rgba(63, 81, 181, 0.08); }
    .hist-q.st-correct { border-left-color: #2e9e5b; }
    .hist-q.st-wrong { border-left-color: #d64545; }
    .hist-q.st-unanswered { border-left-color: #8a94a6; }
    .hist-q.st-partial { border-left-color: #d99100; }
    .hist-q-head {
        width: 100%;
        min-height: 52px;
        padding: 10px 12px;
        border: 0;
        background: none;
        text-align: left;
        cursor: pointer;
        font: inherit;
        color: inherit;
    }
    .hist-q-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hist-q-no { font-weight: 700; color: #3f51b5; }
    .hist-q-chevron { margin-left: auto; color: #8a94a6; font-size: 0.9em; transition: transform 0.15s; }
    .hist-q.open .hist-q-chevron { transform: rotate(180deg); }
    .hist-q.open .hist-q-preview { display: none; }
    .hist-q-preview {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-top: 3px;
        font-size: 0.9em;
        line-height: 1.45;
        color: #3d4959;
        overflow-wrap: anywhere;
    }
    .hist-q-body { padding: 8px 12px 12px; border-top: 1px solid #edf0f7; }
    .hist-q-question { font-size: 0.95em; line-height: 1.55; overflow-wrap: anywhere; }
    .hist-q-question img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 6px; }
    .hist-options { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
    .hist-option {
        border: 1px solid #e3e7f1;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 0.9em;
        line-height: 1.5;
        overflow-wrap: anywhere;
    }
    .hist-option.is-student { background: #eef1ff; border-color: #c7cff0; }
    .hist-option.is-correct { background: #e9f8ee; border-color: #a9dfb8; }
    .hist-option.is-wrong { background: #fdecea; border-color: #f2c3bf; }
    .hist-option.is-student.is-correct { background: #dff3e6; border-color: #8fd3a6; }
    .hist-option-text img { max-width: 100%; height: auto; }
    .opt-letter { font-weight: 700; margin-right: 4px; }
    .opt-badges { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
    .opt-badge {
        font-size: 0.72em;
        font-weight: 700;
        padding: 1px 7px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid #dde2f0;
        color: #667085;
    }
    .opt-badge.you { background: #e4e9ff; color: #3f51b5; border-color: #c7cff0; }
    .opt-badge.right { background: #e7f6ec; color: #1b7f3b; border-color: #b9e3c8; }
    .hist-answer { margin-top: 8px; display: grid; gap: 4px; font-size: 0.92em; }
    .hist-answer-row {
        padding: 7px 10px;
        border-radius: 8px;
        background: #f7f8fd;
        border: 1px solid #e3e7f1;
        overflow-wrap: anywhere;
    }
    .hist-answer-row.right { background: #e9f8ee; border-color: #a9dfb8; color: #1b7f3b; }
    .hist-answer-row.you { background: #eef1ff; border-color: #c7cff0; }
    .hist-answer-label { font-weight: 700; margin-right: 4px; }
    .hist-note { font-size: 0.86em; color: #667085; margin-top: 8px; }
    .hist-empty { padding: 24px 10px; text-align: center; color: #667085; }
    .result-tag { font-weight: 700; font-size: 0.82em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .tag-correct { background: #e7f6ec; color: #1b7f3b; }
    .tag-partial { background: #fff4e5; color: #a15c00; }
    .tag-wrong { background: #fdecea; color: #b3261e; }
    .tag-neutral { background: #eef1ff; color: #4353b8; }

    @media (max-width: 640px) {
        .review-header h1 { font-size: 1.05em; }
        .wrap { padding: 16px 12px 40px; }
        .panel { padding: 16px; }
        .student-row select { width: 100%; }
        .exam-actions .btn { flex: 1; }
        .modal { padding: 0; }
        .modal.show { align-items: stretch; }
        .modal-box { max-width: none; max-height: none; height: 100%; margin: 0; border-radius: 0; }
        .modal-head { padding: 12px 14px; }
        .modal-body { padding: 0; }
        .hist-wrap { padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
        .hist-score { font-size: 1.55em; }
        .hist-facts { font-size: 0.8em; }
        .hist-q-head { padding: 10px; }
        .hist-q-body { padding: 8px 10px 12px; }
        .hist-filter { min-height: 40px; }
        .qmap { grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); gap: 4px; }
        .qmap-btn { min-height: 36px; }
    }
</style>
</head>
<body>
<header class="review-header">
    <div class="review-header-inner">
        <img src="/logo.svg" alt="Logo">
        <div>
            <h1>Ôn tập</h1>
            <p>Chọn đề phù hợp với nhu cầu của bạn</p>
        </div>
        <div class="header-spacer"></div>
        <a class="header-link" href="/">← Về trang thi</a>
    </div>
</header>

<div class="wrap">
    <div id="errorBox" class="error-box" style="display:none;"></div>

    <div class="panel">
        <div class="student-row">
            <label for="studentPicker">Học sinh:</label>
            <select id="studentPicker">
                <option value="">-- Chọn tên của bạn --</option>
            </select>
            <span id="classHint" class="muted"></span>
        </div>
        <p class="muted" style="margin:10px 0 0;">Kết quả và lịch sử bên dưới được tính riêng theo tên bạn chọn.</p>
    </div>

    <div id="listBrowser" style="display:none;">
        <div class="panel" style="padding-bottom:14px;">
            <h2>Danh sách ôn tập</h2>
            <p class="muted" style="margin:0;">Mỗi danh sách gồm nhiều đề. Bạn tự chọn đề, không cần làm theo thứ tự.</p>
        </div>
        <div id="listsGrid" class="list-grid"></div>
    </div>

    <div id="listDetail" style="display:none;">
        <div class="panel">
            <div id="listTitleBlock"></div>
            <div class="toolbar">
                <input type="text" id="examSearch" placeholder="Tìm đề theo tên..." oninput="renderExams()">
                <select id="examFilter" onchange="renderExams()">
                    <option value="all">Tất cả đề</option>
                    <option value="not-done">Chưa làm</option>
                    <option value="done">Đã làm</option>
                    <option value="completed">Đã hoàn thành</option>
                    <option value="retryable">Có thể làm lại</option>
                    <option value="exhausted">Đã hết lượt</option>
                </select>
            </div>
        </div>
        <div id="examList" class="exam-list"></div>
    </div>
</div>

<div class="modal" id="historyModal" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <div class="modal-box">
        <div class="modal-head">
            <h3 id="historyTitle">Lịch sử làm bài</h3>
            <button class="modal-close" onclick="closeHistory()" aria-label="Đóng lịch sử">×</button>
        </div>
        <div class="modal-body" id="historyBody"></div>
    </div>
</div>

<script>
(function () {
    'use strict';

    var listId = getParam('list');
    var currentList = null;
    var currentStudent = null;
    var studentList = [];

    function getParam(name) {
        var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
        return m ? decodeURIComponent(m[1]) : '';
    }

    function esc(value) {
        var d = document.createElement('div');
        d.textContent = value === undefined || value === null ? '' : String(value);
        return d.innerHTML;
    }

    // Hien thi noi dung cau hoi/dap an dang HTML nhung chi giu the dinh dang an toan.
    function rich(html) {
        if (!html) return '';
        var doc = new DOMParser().parseFromString(String(html), 'text/html');
        var allowed = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, P: 1, DIV: 1, BR: 1, SPAN: 1, SUB: 1, SUP: 1, IMG: 1 };
        Array.prototype.slice.call(doc.body.querySelectorAll('*')).forEach(function (el) {
            var tag = el.tagName;
            if (!allowed[tag]) {
                el.replaceWith(document.createTextNode(el.textContent || ''));
                return;
            }
            Array.prototype.slice.call(el.attributes).forEach(function (attr) {
                var keep = tag === 'IMG' && (
                    attr.name === 'alt' || attr.name === 'width' || attr.name === 'height' ||
                    (attr.name === 'src' && (
                        attr.value.indexOf('data:image/') === 0 ||
                        /^\/api\/assets\/[a-f0-9]{32}\.(png|jpe?g|gif|bmp|webp)$/.test(attr.value)
                    ))
                );
                if (!keep) el.removeAttribute(attr.name);
            });
        });
        return doc.body.innerHTML;
    }

    function renderMath(node) {
        if (window.renderMathInElement) {
            try {
                window.renderMathInElement(node, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '\\[', right: '\\]', display: true },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '$', right: '$', display: false }
                    ],
                    throwOnError: false
                });
            } catch (e) {}
        }
    }

    function showError(message) {
        var box = document.getElementById('errorBox');
        box.textContent = message;
        box.style.display = 'block';
    }

    function hideError() {
        document.getElementById('errorBox').style.display = 'none';
    }

    function fetchJson(url, options) {
        return fetch(url, options || {}).then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) {
                if (!res.ok) {
                    var err = new Error(data.error || ('HTTP ' + res.status));
                    err.data = data;
                    throw err;
                }
                return data;
            });
        });
    }

    function formatDate(iso) {
        if (!iso) return '--';
        try { return new Date(iso).toLocaleString('vi-VN'); } catch (e) { return iso; }
    }

    function formatScore(score) {
        var n = Number(score);
        if (isNaN(n)) return '--';
        // Không dùng toFixed + cắt '0' vì điểm 100 sẽ thành '1'.
        return String(Math.round(n * 100) / 100).replace('.', ',');
    }

    function formatScoreWithMax(score, maxScore) {
        var max = Number(maxScore);
        return formatScore(score) + (max > 0 ? '/' + formatScore(max) : '');
    }

    function loadStudents() {
        fetchJson('/api/review/students').then(function (data) {
            studentList = data.students || [];
            var picker = document.getElementById('studentPicker');
            var saved = '';
            try { saved = localStorage.getItem('quiz_review_student') || ''; } catch (e) {}
            var html = '<option value="">-- Chọn tên của bạn --</option>';
            for (var i = 0; i < studentList.length; i++) {
                var s = studentList[i];
                html += '<option value="' + esc(s.stt) + '"' + (String(s.stt) === String(saved) ? ' selected' : '') + '>' +
                    esc(s.stt) + '. ' + esc(s.fullName) + '</option>';
            }
            picker.innerHTML = html;
            document.getElementById('classHint').textContent = data.className ? ('Lớp ' + data.className) : '';
            if (saved) {
                for (var j = 0; j < studentList.length; j++) {
                    if (String(studentList[j].stt) === String(saved)) {
                        currentStudent = studentList[j];
                        break;
                    }
                }
            }
            picker.addEventListener('change', function () {
                var value = picker.value;
                currentStudent = null;
                for (var k = 0; k < studentList.length; k++) {
                    if (String(studentList[k].stt) === String(value)) {
                        currentStudent = studentList[k];
                        break;
                    }
                }
                try {
                    if (value) localStorage.setItem('quiz_review_student', value);
                    else localStorage.removeItem('quiz_review_student');
                } catch (e) {}
                if (listId) loadListDetail();
            });
            if (listId) loadListDetail();
        }).catch(function (err) {
            showError('Không tải được danh sách học sinh: ' + err.message);
            if (listId) loadListDetail();
        });
    }

    function loadListBrowser() {
        document.getElementById('listBrowser').style.display = 'block';
        document.getElementById('listDetail').style.display = 'none';
        fetchJson('/api/review/lists').then(function (data) {
            var grid = document.getElementById('listsGrid');
            var lists = data.lists || [];
            if (!lists.length) {
                grid.innerHTML = '<div class="empty">Chưa có danh sách ôn tập nào được công khai.</div>';
                return;
            }
            grid.innerHTML = lists.map(function (list) {
                return '<a class="list-card" href="/on-tap?list=' + encodeURIComponent(list.id) + '">' +
                    '<h3>' + esc(list.name) + '</h3>' +
                    (list.subject ? '<div class="badge">' + esc(list.subject) + '</div>' : '') +
                    '<p class="muted" style="margin:8px 0 0;">' + esc(list.description || 'Không có mô tả') + '</p>' +
                    '<p class="muted" style="margin:10px 0 0;"><strong>' + list.itemCount + '</strong> đề</p>' +
                    '</a>';
            }).join('');
        }).catch(function (err) {
            showError('Không tải được danh sách ôn tập: ' + err.message);
        });
    }

    function loadListDetail() {
        if (!listId) return;
        document.getElementById('listBrowser').style.display = 'none';
        document.getElementById('listDetail').style.display = 'block';
        document.getElementById('listTitleBlock').innerHTML = '<h2>Đang tải...</h2>';
        var url = '/api/review/lists/' + encodeURIComponent(listId) +
            (currentStudent ? ('?stt=' + encodeURIComponent(currentStudent.stt)) : '');
        fetchJson(url).then(function (data) {
            currentList = data.list;
            hideError();
            var title = '<h2>' + esc(currentList.name) + '</h2>';
            if (currentList.subject) title += '<div class="badge" style="margin-top:6px;">' + esc(currentList.subject) + '</div>';
            if (currentList.description) title += '<p class="muted" style="margin:8px 0 0;">' + esc(currentList.description) + '</p>';
            document.getElementById('listTitleBlock').innerHTML = title;
            renderExams();
        }).catch(function (err) {
            showError(err.message || 'Không tìm thấy danh sách ôn tập.');
            document.getElementById('listTitleBlock').innerHTML = '<h2>Không thể mở danh sách</h2>';
            document.getElementById('examList').innerHTML = '';
        });
    }

    function matchesFilter(item, filter) {
        var h = item.history || {};
        if (filter === 'not-done') return !h.done;
        if (filter === 'done') return !!h.done;
        if (filter === 'completed') return !!h.completed;
        if (filter === 'retryable') return !!h.done && !!h.canAttempt;
        if (filter === 'exhausted') return !!h.exhausted;
        return true;
    }

    function statusText(h) {
        if (h.hasActive) return 'Đang làm dở (lượt chưa nộp)';
        if (h.exhausted) return 'Đã hết lượt';
        if (h.attemptCount > 0) return 'Đã làm ' + h.attemptCount + ' lần';
        return 'Chưa làm';
    }

    function settingsText(settings, history) {
        var parts = [];
        parts.push(settings.timeLimit > 0 ? (settings.timeLimit + ' phút') : 'Không giới hạn thời gian');
        if (settings.maxAttempts > 0) {
            var used = (history && history.attemptsUsed) || 0;
            parts.push('Còn ' + Math.max(0, settings.maxAttempts - used) + '/' + settings.maxAttempts + ' lượt');
        } else {
            parts.push('Không giới hạn số lần');
        }
        return parts.join(' • ');
    }

    function renderExams() {
        if (!currentList) return;
        var search = (document.getElementById('examSearch').value || '').trim().toLowerCase();
        var filter = document.getElementById('examFilter').value;
        var items = (currentList.items || []).filter(function (item) {
            if (search && String(item.examName).toLowerCase().indexOf(search) === -1) return false;
            return matchesFilter(item, filter);
        });

        var container = document.getElementById('examList');
        if (!items.length) {
            container.innerHTML = '<div class="empty">Không có đề phù hợp với bộ lọc.</div>';
            return;
        }

        container.innerHTML = items.map(function (item) {
            var h = item.history || {};
            var scoreLine = '';
            if (h.attemptCount > 0) {
                scoreLine = 'Điểm gần nhất: <strong>' + formatScoreWithMax(h.latestScore, h.latestMaxScore) + '</strong>' +
                    ' • Điểm cao nhất: <strong>' + formatScoreWithMax(h.bestScore, h.bestMaxScore) + '</strong>';
            } else {
                scoreLine = 'Chưa nộp lần nào';
            }

            var startHtml;
            if (!item.available) {
                startHtml = '<button class="btn" disabled>Đề không còn khả dụng</button>';
            } else if (!currentStudent) {
                startHtml = '<button class="btn" disabled>Chọn tên để làm bài</button>';
            } else if (h.hasActive) {
                var resumeUrl = '/?reviewList=' + encodeURIComponent(currentList.id) +
                    '&reviewExam=' + encodeURIComponent(item.examId) +
                    '&reviewStt=' + encodeURIComponent(currentStudent.stt);
                startHtml = '<a class="btn btn-primary" href="' + resumeUrl + '">Tiếp tục lượt đang làm</a>';
            } else if (!h.canAttempt) {
                startHtml = '<button class="btn" disabled>Đã hết lượt</button>';
            } else {
                var startUrl = '/?reviewList=' + encodeURIComponent(currentList.id) +
                    '&reviewExam=' + encodeURIComponent(item.examId) +
                    '&reviewStt=' + encodeURIComponent(currentStudent.stt);
                startHtml = '<a class="btn btn-primary" href="' + startUrl + '">' +
                    (h.attemptCount > 0 ? 'Làm lại' : 'Bắt đầu') + '</a>';
            }

            var historyHtml = '';
            if (currentStudent && h.attemptCount > 0) {
                historyHtml = '<button class="btn btn-secondary" onclick="openHistory(\'' +
                    esc(item.examId).replace(/'/g, "\\'") + '\', \'' +
                    esc(item.examName).replace(/'/g, "\\'") + '\')">Xem lịch sử</button>';
            }

            return '<div class="exam-card">' +
                '<div class="exam-card-head">' +
                    '<div>' +
                        '<h3>' + esc(item.examName) + '</h3>' +
                        '<div class="exam-meta">' + item.questionCount + ' câu • ' + esc(settingsText(item.settings, h)) + '</div>' +
                        '<div class="exam-meta exam-status" style="margin-top:6px;">' + esc(statusText(h)) + '</div>' +
                        '<div class="exam-meta">' + scoreLine + '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="exam-actions">' + startHtml + historyHtml + '</div>' +
            '</div>';
        }).join('');
    }

    // ================== LỊCH SỬ LÀM BÀI ==================
    var historyData = null;
    var historyFilter = 'all';
    var historyQuery = '';
    var historyAttemptId = null;
    var historyExpanded = null;
    var historyNavOpen = false;

    var STATUS_LABEL = {
        correct: 'Đúng',
        partial: 'Đúng một phần',
        wrong: 'Sai',
        unanswered: 'Chưa trả lời'
    };

    function plainText(html) {
        var doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
        return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
    }

    // Câu hỏi lịch sử cũ có thể không có status -> mới dùng dự phòng.
    function detailStatus(d) {
        if (d.status) return d.status;
        if (d.isCorrect === true) return 'correct';
        if (d.hasAnswer === false) return 'unanswered';
        return 'wrong';
    }

    function statusTag(status) {
        var cls = status === 'correct' ? 'tag-correct' :
            status === 'partial' ? 'tag-partial' :
            status === 'unanswered' ? 'tag-neutral' : 'tag-wrong';
        return '<span class="result-tag ' + cls + '">' + esc(STATUS_LABEL[status] || 'Sai') + '</span>';
    }

    function historyCounts(details) {
        var counts = { all: details.length, correct: 0, partial: 0, wrong: 0, unanswered: 0 };
        details.forEach(function (d) {
            var s = detailStatus(d);
            if (counts[s] !== undefined) counts[s]++;
        });
        return counts;
    }

    function historyFilterDefs(counts) {
        var defs = [
            { key: 'all', label: 'Tất cả', count: counts.all },
            { key: 'correct', label: 'Đúng', count: counts.correct },
            { key: 'wrong', label: 'Sai', count: counts.wrong },
            { key: 'unanswered', label: 'Chưa trả lời', count: counts.unanswered }
        ];
        // Chỉ hiện "Đúng một phần" với đề/câu hỗ trợ (câu đúng/sai có điểm từng ý).
        if (counts.partial > 0) defs.push({ key: 'partial', label: 'Đúng một phần', count: counts.partial });
        return defs;
    }

    function historyAttempts() {
        return (historyData && historyData.attempts) || [];
    }

    function currentAttempt() {
        var list = historyAttempts();
        for (var i = 0; i < list.length; i++) {
            if (String(list[i].id) === String(historyAttemptId)) return list[i];
        }
        return list[0] || null;
    }

    function currentDetails() {
        var a = currentAttempt();
        return (a && Array.isArray(a.details)) ? a.details : [];
    }

    function detailMatches(d) {
        if (!detailMatchesFilter(d)) return false;
        return detailMatchesQuery(d);
    }

    function detailMatchesFilter(d) {
        if (historyFilter === 'all') return true;
        return detailStatus(d) === historyFilter;
    }

    function detailMatchesQuery(d) {
        if (!historyQuery) return true;
        var qNo = ((d.index === undefined || d.index === null) ? 0 : d.index) + 1;
        var m = historyQuery.match(/^(?:câu\s*)?(\d+)$/i);
        if (m) return Number(m[1]) === qNo;
        if (!d._plain) d._plain = plainText(d.question); // cache, không gửi đi đâu
        return d._plain.toLowerCase().indexOf(historyQuery) !== -1;
    }

    function escAttr(value) {
        return esc(value).replace(/"/g, '&quot;');
    }

    function questionNumber(d, pos) {
        return ((d.index === undefined || d.index === null) ? pos : d.index) + 1;
    }

    function attemptChipHtml(a) {
        var selected = currentAttempt();
        var active = selected && String(selected.id) === String(a.id);
        return '<button type="button" class="hist-attempt' + (active ? ' active' : '') +
            '" data-act="attempt" data-id="' + escAttr(a.id) + '" aria-pressed="' + (active ? 'true' : 'false') + '">' +
            '<span class="hist-attempt-title">Lần ' + esc(a.attemptNo || '--') + (a.expired ? ' • quá giờ' : '') + '</span>' +
            '<span class="hist-attempt-score">' + esc(formatScoreWithMax(a.score, a.maxScore)) + ' điểm</span>' +
            '<span class="hist-attempt-date">' + esc(formatDate(a.submittedAt)) + '</span>' +
            '</button>';
    }

    function countChip(cls, label, value) {
        return '<span class="hist-count ' + cls + '">' + esc(label) + ' <strong>' + value + '</strong></span>';
    }

    function renderOverview(a) {
        var summary = historyData.summary || {};
        var total = a.totalQuestions || 0;
        var ratio = total ? Math.round((a.correctCount || 0) / total * 100) : 0;
        var html = '<div class="hist-overview">' +
            '<div class="hist-topline">' +
                '<div class="hist-score">' + esc(formatScoreWithMax(a.score, a.maxScore)) + ' <small>điểm</small></div>' +
                '<div class="hist-facts">' +
                    '<span>Thời gian làm: <strong>' + esc(a.timeSpent || '--') + '</strong></span>' +
                    '<span>Nộp lúc: ' + esc(formatDate(a.submittedAt)) + '</span>' +
                    '<span>Tỉ lệ đúng: <strong>' + ratio + '%</strong> (' + (a.correctCount || 0) + '/' + total + ')</span>' +
                '</div>' +
            '</div>' +
            '<div class="hist-counts">' +
                countChip('c-correct', 'Đúng', a.correctCount || 0) +
                ((a.partialCount || 0) > 0 ? countChip('c-partial', 'Đúng một phần', a.partialCount) : '') +
                countChip('c-wrong', 'Sai', a.wrongCount || 0) +
                countChip('c-unanswered', 'Chưa trả lời', a.unansweredCount || 0) +
            '</div>';
        // Thống kê phụ của cả đề để trong mục thu gọn; phần trên chỉ nói về lần đang xem.
        if (summary.attemptCount > 1) {
            html += '<details class="hist-more"><summary>Thống kê các lần làm</summary><p>' +
                'Đã nộp <strong>' + summary.attemptCount + '</strong> lần' +
                ' • Cao nhất <strong>' + esc(formatScoreWithMax(summary.bestScore, summary.bestMaxScore)) + '</strong>' +
                ' • Gần nhất <strong>' + esc(formatScoreWithMax(summary.latestScore, summary.latestMaxScore)) + '</strong>' +
                '</p></details>';
        }
        return html + '</div>';
    }

    function renderToolbar(counts) {
        return '<div class="hist-toolbar">' +
            '<div class="hist-search"><input type="search" id="histSearch" value="' + escAttr(historyQuery) +
                '" placeholder="Tìm theo số câu hoặc nội dung..." aria-label="Tìm câu hỏi"></div>' +
            '<div class="hist-filters" role="group" aria-label="Lọc câu hỏi">' +
                historyFilterDefs(counts).map(function (f) {
                    return '<button type="button" class="hist-filter' + (historyFilter === f.key ? ' active' : '') +
                        '" data-act="filter" data-filter="' + f.key + '" aria-pressed="' + (historyFilter === f.key ? 'true' : 'false') + '">' +
                        f.label + '<span class="n">' + f.count + '</span></button>';
                }).join('') +
            '</div>' +
        '</div>';
    }

    function renderQmap(details) {
        var hasPartial = details.some(function (d) { return detailStatus(d) === 'partial'; });
        var legend = '<div class="qmap-legend">' +
            '<span><span class="legend-dot" style="background:#cfe9d8"></span>Đúng</span>' +
            '<span><span class="legend-dot" style="background:#f6cfcc"></span>Sai</span>' +
            '<span><span class="legend-dot" style="background:#dde2f8"></span>Chưa trả lời</span>' +
            (hasPartial ? '<span><span class="legend-dot" style="background:#f6dfba"></span>Đúng một phần</span>' : '') +
            '</div>';
        return '<details class="hist-nav"' + (historyNavOpen ? ' open' : '') + '>' +
            '<summary>Bảng số câu (' + details.length + ')</summary>' +
            '<div class="qmap">' + details.map(function (d, pos) {
                var st = detailStatus(d);
                return '<button type="button" class="qmap-btn st-' + st + '" data-act="goto" data-qi="' + pos +
                    '" title="Câu ' + questionNumber(d, pos) + ': ' + esc(STATUS_LABEL[st] || 'Sai') + '">' +
                    questionNumber(d, pos) + '</button>';
            }).join('') + '</div>' + legend +
            '</details>';
    }

    function renderOption(d, oi, text) {
        var answersShown = d.correctAnswerText !== undefined && d.correctAnswerText !== null;
        var picked = false;
        var pickedValue = null;
        if (d.type === 'multi') {
            picked = Array.isArray(d.studentAnswer) && d.studentAnswer.indexOf(oi) !== -1;
        } else if (d.type === 'truefalse') {
            picked = Array.isArray(d.studentAnswer) && typeof d.studentAnswer[oi] === 'boolean';
            if (picked) pickedValue = !!d.studentAnswer[oi];
        } else {
            picked = d.studentAnswer === oi;
        }

        var right = false;
        var rightValue = null;
        if (answersShown) {
            if (d.type === 'multi') {
                right = Array.isArray(d.correctList) && d.correctList.indexOf(oi) !== -1;
            } else if (d.type === 'truefalse') {
                if (Array.isArray(d.correctTF) && oi < d.correctTF.length) {
                    right = true;
                    rightValue = !!d.correctTF[oi];
                }
            } else {
                right = d.correctAnswer === oi;
            }
        }

        var matched = d.type === 'truefalse' ? (picked && right && pickedValue === rightValue) : (picked && right);
        var cls = 'hist-option';
        if (answersShown) {
            if (picked && right && matched) cls += ' is-student is-correct';
            else if (picked) cls += ' is-wrong';
            else if (right && d.type !== 'truefalse') cls += ' is-correct';
        } else if (picked) {
            cls += ' is-student';
        }

        var badges = '';
        if (picked) {
            badges += '<span class="opt-badge you">Bạn chọn' +
                (pickedValue === null ? '' : ': ' + (pickedValue ? 'Đúng' : 'Sai')) + '</span>';
        }
        if (answersShown && right && d.type !== 'truefalse') {
            badges += '<span class="opt-badge right">Đáp án đúng</span>';
        }
        if (answersShown && right && d.type === 'truefalse') {
            badges += '<span class="opt-badge right">Đáp án: ' + (rightValue ? 'Đúng' : 'Sai') + '</span>';
        }

        return '<li class="' + cls + '">' +
            '<div class="hist-option-text"><span class="opt-letter">' + String.fromCharCode(65 + oi) + '.</span>' + rich(text) + '</div>' +
            (badges ? '<div class="opt-badges">' + badges + '</div>' : '') +
            '</li>';
    }

    function renderQuestionBody(d, pos) {
        var html = '<div class="hist-q-body"><div class="hist-q-question">' +
            (rich(d.question) || '<em>Câu hỏi không có nội dung.</em>') + '</div>';
        if (d.image) {
            html += '<div class="hist-q-question"><img src="' + escAttr(d.image) + '" alt="Hình minh họa câu ' + questionNumber(d, pos) + '"></div>';
        }

        var options = Array.isArray(d.options) ? d.options : null;
        if (options && options.length && d.type !== 'shortanswer') {
            html += '<ul class="hist-options">' + options.map(function (opt, oi) {
                return renderOption(d, oi, opt);
            }).join('') + '</ul>';
        }

        // Chỉ hiện hàng chữ cho câu không có phương án (trả lời ngắn) hoặc khi
        // lịch sử cũ không lưu danh sách phương án.
        var answersShown = d.correctAnswerText !== undefined && d.correctAnswerText !== null;
        if (!options || !options.length || d.type === 'shortanswer') {
            html += '<div class="hist-answer">' +
                '<div class="hist-answer-row you"><span class="hist-answer-label">Bạn trả lời:</span>' +
                    (d.studentAnswerText ? rich(d.studentAnswerText) : 'Chưa trả lời') + '</div>';
            if (answersShown) {
                html += '<div class="hist-answer-row right"><span class="hist-answer-label">Đáp án đúng:</span>' +
                    (rich(d.correctAnswerText) || 'Chưa có dữ liệu đáp án') + '</div>';
            }
            html += '</div>';
        }
        if (!answersShown) {
            html += '<div class="hist-note">Giáo viên không cho xem đáp án đúng.</div>';
        }
        return html + '</div>';
    }

    function renderQuestionRow(d, pos) {
        var status = detailStatus(d);
        var open = historyExpanded === pos;
        if (!d._plain) d._plain = plainText(d.question); // cache, không gửi đi đâu
        return '<div class="hist-q st-' + status + (open ? ' open' : '') + '" data-qi="' + pos + '">' +
            '<button type="button" class="hist-q-head" data-act="toggle" data-qi="' + pos +
                '" aria-expanded="' + (open ? 'true' : 'false') + '" aria-controls="hist-q-body-' + pos + '">' +
                '<span class="hist-q-top"><span class="hist-q-no">Câu ' + questionNumber(d, pos) + '</span>' +
                    statusTag(status) +
                    '<span class="hist-q-chevron" aria-hidden="true">▾</span>' +
                '</span>' +
                '<span class="hist-q-preview">' + (esc(d._plain) || 'Câu hỏi không có nội dung.') + '</span>' +
            '</button>' +
            (open ? '<div id="hist-q-body-' + pos + '">' + renderQuestionBody(d, pos) + '</div>' : '') +
            '</div>';
    }

    function renderHistory() {
        if (!historyData) return;
        var body = document.getElementById('historyBody');
        var prevSearch = document.getElementById('histSearch');
        var refocus = !!prevSearch && document.activeElement === prevSearch;

        var attempts = historyAttempts();
        if (!attempts.length) {
            body.innerHTML = '<div class="hist-wrap"><div class="hist-empty">Chưa có lần làm bài nào.</div></div>';
            return;
        }

        var attempt = currentAttempt();
        var hasDetails = !!(attempt && attempt.canViewDetails);
        var details = hasDetails && Array.isArray(attempt.details) ? attempt.details : [];

        var html = '<div class="hist-wrap">' +
            '<div class="hist-attempts">' + attempts.map(attemptChipHtml).join('') + '</div>' +
            renderOverview(attempt);

        if (!hasDetails) {
            html += '<div class="hist-empty">Giáo viên không cho xem chi tiết bài làm.</div>';
        } else if (!details.length) {
            html += '<div class="hist-empty">Không có chi tiết cho lần làm này.</div>';
        } else {
            html += renderToolbar(historyCounts(details)) + renderQmap(details);
            var shown = [];
            details.forEach(function (d, pos) {
                if (detailMatches(d)) shown.push(pos);
            });
            if (!shown.length) {
                html += '<div class="hist-empty">Không có câu phù hợp với bộ lọc hoặc từ khóa tìm kiếm.</div>';
            } else {
                html += '<div class="hist-list">' + shown.map(function (pos) {
                    return renderQuestionRow(details[pos], pos);
                }).join('') + '</div>';
            }
        }

        body.innerHTML = html + '</div>';
        if (refocus) {
            var input = document.getElementById('histSearch');
            if (input) {
                input.focus();
                input.setSelectionRange(input.value.length, input.value.length);
            }
        }
        renderMath(body);
    }

    // Ô tìm kiếm được render lại theo danh sách nên phải giữ con trỏ ở cuối.
    function toggleQuestion(pos) {
        var body = document.getElementById('historyBody');
        var head = body.querySelector('.hist-q-head[data-qi="' + pos + '"]');
        var before = head ? head.getBoundingClientRect().top : null;
        historyExpanded = historyExpanded === pos ? null : pos;
        renderHistory();
        if (before === null) return;
        // Giữ câu đang mở/thu ở đúng vị trí màn hình.
        var moved = body.querySelector('.hist-q-head[data-qi="' + pos + '"]');
        if (moved) body.scrollTop += moved.getBoundingClientRect().top - before;
    }

    // Bấm số câu ở bảng điều hướng: nếu câu đang bị ẩn bởi bộ lọc/tìm kiếm
    // thì chuyển sang bộ lọc đúng trạng thái của câu đó.
    function gotoQuestion(pos) {
        var d = currentDetails()[pos];
        if (!d) return;
        if (!detailMatches(d)) {
            historyFilter = detailStatus(d);
            historyQuery = '';
        }
        historyExpanded = pos;
        renderHistory();
        var body = document.getElementById('historyBody');
        var head = body.querySelector('.hist-q-head[data-qi="' + pos + '"]');
        if (!head) return;
        body.scrollTop += head.getBoundingClientRect().top - body.getBoundingClientRect().top - 8;
        head.focus({ preventScroll: true });
    }

    function selectAttempt(id) {
        historyAttemptId = id;
        historyFilter = 'all';
        historyQuery = '';
        historyExpanded = null;
        renderHistory();
    }

    window.openHistory = function (examId, examName) {
        if (!currentStudent) return;
        var modal = document.getElementById('historyModal');
        document.getElementById('historyTitle').textContent = 'Lịch sử: ' + examName;
        document.getElementById('historyBody').innerHTML = '<p class="muted" style="padding:16px 18px;">Đang tải...</p>';
        modal.classList.add('show');
        document.body.classList.add('modal-open');
        historyData = null;
        historyFilter = 'all';
        historyQuery = '';
        historyAttemptId = null;
        historyExpanded = null;
        historyNavOpen = false;
        var url = '/api/review/history?listId=' + encodeURIComponent(currentList.id) +
            '&examId=' + encodeURIComponent(examId) +
            '&stt=' + encodeURIComponent(currentStudent.stt);
        fetchJson(url).then(function (data) {
            historyData = data;
            renderHistory();
            document.getElementById('historyBody').scrollTop = 0;
        }).catch(function (err) {
            document.getElementById('historyBody').innerHTML = '<div class="error-box" style="margin:16px;">' + esc(err.message) + '</div>';
        });
    };

    window.closeHistory = function () {
        document.getElementById('historyModal').classList.remove('show');
        document.body.classList.remove('modal-open');
    };

    var historyBodyEl = document.getElementById('historyBody');

    historyBodyEl.addEventListener('input', function (e) {
        if (!e.target || e.target.id !== 'histSearch') return;
        historyQuery = e.target.value.trim().toLowerCase();
        historyExpanded = null;
        renderHistory();
    });

    // Trạng thái mở/đóng của bảng số câu được giữ khi danh sách render lại.
    historyBodyEl.addEventListener('toggle', function (e) {
        if (e.target && e.target.classList && e.target.classList.contains('hist-nav')) {
            historyNavOpen = e.target.open;
        }
    }, true);

    historyBodyEl.addEventListener('click', function (e) {
        var el = e.target;
        while (el && el !== this) {
            var act = el.getAttribute && el.getAttribute('data-act');
            if (act === 'filter') {
                historyFilter = el.getAttribute('data-filter');
                historyExpanded = null;
                renderHistory();
                return;
            }
            if (act === 'toggle') {
                toggleQuestion(Number(el.getAttribute('data-qi')));
                return;
            }
            if (act === 'goto') {
                gotoQuestion(Number(el.getAttribute('data-qi')));
                return;
            }
            if (act === 'attempt') {
                selectAttempt(el.getAttribute('data-id'));
                return;
            }
            el = el.parentNode;
        }
    });

    document.getElementById('historyModal').addEventListener('click', function (e) {
        if (e.target === this) window.closeHistory();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && document.getElementById('historyModal').classList.contains('show')) {
            window.closeHistory();
        }
    });

    if (listId) {
        loadListDetail();
    } else {
        loadListBrowser();
    }
    loadStudents();
})();
</script>
</body>
</html>
